name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate questions.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: python3 -c "
import json, sys
with open('cs-quiz/data/questions.json') as f:
    qs = json.load(f)
required = ['id','topic','prompt','type','correct','explanation','misconception','difficulty']
errors = []
for q in qs:
    missing = [k for k in required if k not in q]
    if missing:
        errors.append(f'Question {q.get(\"id\",\"?\")} missing: {missing}')
if errors:
    print('\n'.join(errors)); sys.exit(1)
print(f'OK: {len(qs)} questions validated')
"

  deploy:
    name: Deploy to Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
