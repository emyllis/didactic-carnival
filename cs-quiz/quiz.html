<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – CS Misconceptions</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav-content">
      <a href="index.html" class="nav-logo" aria-label="CS Misconceptions Quiz Home">🧠 CS Misconceptions</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="progress.html" class="nav-link">My Progress</a>
      </div>
    </div>
  </nav>

  <main class="container" id="quiz-main">
    <!-- Quiz header -->
    <div class="quiz-header">
      <div class="quiz-meta">
        <span id="pack-title" class="topic-badge" aria-live="polite"></span>
        <span id="question-counter" aria-live="polite"></span>
      </div>
      <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Question area -->
    <div class="question-card" id="question-card" aria-live="polite">
      <div class="question-meta">
        <span id="difficulty-badge" class="difficulty-badge"></span>
        <span id="topic-label" class="topic-badge-sm"></span>
      </div>
      <h2 id="question-prompt" class="question-prompt"></h2>

      <!-- Multiple choice / multi-select options -->
      <div id="options-container" role="group" aria-labelledby="question-prompt"></div>

      <!-- Short answer textarea -->
      <div id="short-answer-container" style="display:none">
        <label for="short-answer-input" class="sr-only">Your answer</label>
        <textarea id="short-answer-input" class="short-answer-input"
          placeholder="Type your answer here…"
          aria-label="Short answer input"
          rows="4"></textarea>
      </div>

      <!-- Confidence slider -->
      <div class="confidence-section" id="confidence-section">
        <label for="confidence-slider" class="confidence-label">
          Confidence: <span id="confidence-value" aria-live="polite">50</span>%
        </label>
        <input type="range" id="confidence-slider" class="confidence-slider"
          min="0" max="100" value="50" step="5"
          aria-label="Confidence level from 0 to 100 percent">
      </div>

      <!-- Submit button -->
      <div class="question-actions">
        <button class="btn btn-primary" id="submit-btn" aria-label="Submit answer">
          Submit Answer
        </button>
      </div>

      <!-- Feedback (hidden until submitted) -->
      <div id="feedback-section" style="display:none" aria-live="polite" aria-atomic="true">
        <div id="feedback-card" class="feedback-card">
          <div class="feedback-header">
            <span id="feedback-icon" aria-hidden="true"></span>
            <strong id="feedback-title"></strong>
          </div>
          <p id="feedback-explanation"></p>
          <div class="misconception-block">
            <span class="misconception-tag" aria-label="Misconception addressed">🎯 Misconception</span>
            <p id="feedback-misconception"></p>
          </div>
          <div id="feedback-references" class="references-block" style="display:none">
            <strong>References:</strong>
            <ul id="references-list"></ul>
          </div>
        </div>

        <!-- Navigation after answer -->
        <div class="nav-actions">
          <button class="btn btn-secondary" id="prev-btn" aria-label="Go to previous question">← Previous</button>
          <button class="btn btn-primary" id="next-btn" aria-label="Go to next question">Next →</button>
        </div>
      </div>
    </div>

    <!-- Results screen (hidden until end) -->
    <div id="results-screen" style="display:none" role="region" aria-label="Quiz results">
      <div class="results-card">
        <div class="results-icon" aria-hidden="true" id="results-emoji">🎉</div>
        <h2 id="results-title">Pack Complete!</h2>
        <p id="results-summary" class="results-summary"></p>
        <div class="stats-grid results-stats" id="results-stats"></div>
        <div class="results-actions">
          <button class="btn btn-primary" id="restart-btn">🔄 Restart Pack</button>
          <a href="index.html" class="btn btn-secondary">← Back to Home</a>
          <a href="progress.html" class="btn btn-secondary">📊 View Progress</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/questions.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
